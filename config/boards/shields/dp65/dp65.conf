# Base keyboard features.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_DISPLAY=y

# The PCB target is nice!nano / nice!nano v2, so keep power usage conservative.
CONFIG_ZMK_SLEEP=y

# AS5600 note:
# ZMK does not currently ship a built-in AS5600 magnetic encoder driver that can
# emit ZMK sensor rotation events. The shield keeps reserved I2C nodes and the
# README documents the integration point for a future out-of-tree driver/module.
