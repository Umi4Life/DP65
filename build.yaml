# ZMK build matrix for DP65.
#
# nice!view support is enabled by stacking ZMK's built-in shields:
#   dp65_left nice_view_adapter nice_view
#   dp65_right nice_view_adapter nice_view
#
---
include:
  - board: nice_nano_v2
    shield: "dp65_left nice_view_adapter nice_view"
    artifact-name: dp65_left_nice_nano_v2_nice_view
  - board: nice_nano_v2
    shield: "dp65_right nice_view_adapter nice_view"
    artifact-name: dp65_right_nice_nano_v2_nice_view
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_nice_nano_v2
