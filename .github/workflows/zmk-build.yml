name: Build ZMK firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/zmk-build.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/zmk-build.yml"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      config_path: config
      build_matrix_path: build.yaml
